    <!-- Tailwind CDN with Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Bebas Neue, Oswald, Archivo, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Bebas+Neue&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              forge: {
                bg: '#0a0a0a',
                darker: '#050505',
                card: '#141414',
                hover: '#1a1a1a',
                border: '#1f1f1f',
                borderLight: '#2a2a2a',
                accent: '#FF5400',
                accentBright: '#FF7A33',
                accentDim: '#B33A00',
                silver: '#C8C8C8',
                silverDim: '#5a5a5a',
                muted: '#6a6a6a',
                cyan: '#00E5FF',
                emerald: '#10B981'
              }
            },
            fontFamily: {
              display: ['"Bebas Neue"', 'sans-serif'],
              heading: ['"Oswald"', 'sans-serif'],
              body: ['"Archivo"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }

    <style>
      :root {
        --bg: #0a0a0a;
        --bg-darker: #050505;
        --bg-card: #141414;
        --bg-card-hover: #1a1a1a;
        --fg: #f5f5f5;
        --fg-dim: #c0c0c0;
        --muted: #6a6a6a;
        --accent: #FF5400;
        --accent-bright: #FF7A33;
        --accent-dim: #B33A00;
        --accent-glow: rgba(255, 84, 0, 0.45);
        --silver: #C8C8C8;
        --silver-dim: #5a5a5a;
        --border: #1f1f1f;
        --border-light: #2a2a2a;
      }
      
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: 'Archivo', sans-serif;
        overflow-x: hidden;
        margin: 0;
        -webkit-font-smoothing: antialiased;
      }
      
      /* Typography Classes */
      .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.01em; }
      .font-heading { font-family: 'Oswald', sans-serif; }
      .font-body { font-family: 'Archivo', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      
      /* Grain overlay */
      .grain {
        position: fixed;
        inset: -10%;
        pointer-events: none;
        z-index: 200;
        opacity: 0.07;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='250'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        mix-blend-mode: overlay;
        will-change: transform;
      }
      
      /* Background texture */
      .bg-textured {
        background-color: var(--bg);
        background-image: 
          radial-gradient(circle at 20% 20%, rgba(255, 84, 0, 0.07) 0%, transparent 45%),
          radial-gradient(circle at 80% 80%, rgba(0, 229, 255, 0.04) 0%, transparent 45%),
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='r'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23r)' opacity='0.3'/></svg>");
        background-blend-mode: normal, normal, overlay;
      }
      
      /* Scan line overlay */
      .scan-line {
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 3px,
          rgba(0, 0, 0, 0.08) 3px,
          rgba(0, 0, 0, 0.08) 4px
        );
        pointer-events: none;
        z-index: 10;
        opacity: 0.5;
      }
      
      /* High-Precision Dark Industrial Form Inputs */
      .form-input {
        background-color: #070707 !important;
        border: 1px solid #242424 !important;
        color: #f5f5f5 !important;
        padding: 0.9rem 1.1rem !important;
        font-family: 'JetBrains Mono', monospace !important;
        font-size: 0.875rem !important;
        width: 100% !important;
        border-radius: 0px !important;
        transition: all 0.25s ease !important;
        letter-spacing: 0.03em !important;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8) !important;
      }
      .form-input:focus {
        outline: none !important;
        border-color: var(--accent) !important;
        background-color: #0c0c0c !important;
        box-shadow: 0 0 16px rgba(255, 84, 0, 0.18), inset 0 2px 4px rgba(0, 0, 0, 0.9) !important;
      }
      .form-input::placeholder {
        color: #555555 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.12em !important;
        font-size: 0.75rem !important;
        font-family: 'JetBrains Mono', monospace !important;
      }
      
      /* Browser Autofill Dark Fix */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      textarea:-webkit-autofill {
        -webkit-text-fill-color: #f5f5f5 !important;
        -webkit-box-shadow: 0 0 0px 1000px #070707 inset !important;
        box-shadow: 0 0 0px 1000px #070707 inset !important;
        transition: background-color 5000s ease-in-out 0s !important;
      }
      
      /* Marquee Animation */
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .marquee-track {
        display: flex;
        animation: marquee 35s linear infinite;
        width: max-content;
      }
      .marquee-track:hover {
        animation-play-state: paused;
      }
      
      /* Pulse Button */
      @keyframes pulse-cta {
        0%, 100% { 
          box-shadow: 0 0 0 0 rgba(255, 84, 0, 0.65), 0 0 35px rgba(255, 84, 0, 0.25);
        }
        50% { 
          box-shadow: 0 0 0 14px rgba(255, 84, 0, 0), 0 0 35px rgba(255, 84, 0, 0.25);
        }
      }
      .pulse-btn { animation: pulse-cta 2.6s ease-out infinite; }
      
      /* Image Noir Treatment */
      .img-noir {
        filter: grayscale(100%) contrast(1.3) brightness(0.85);
        transition: filter 0.6s ease, transform 0.6s ease;
      }
      .group:hover .img-noir,
      .img-noir:hover {
        filter: grayscale(20%) contrast(1.2) brightness(0.95);
      }
      
      /* Text Strokes */
      .text-stroke {
        -webkit-text-stroke: 1.5px var(--silver-dim);
        color: transparent;
      }
      .text-stroke-accent {
        -webkit-text-stroke: 1.5px var(--accent);
        color: transparent;
      }
      
      /* Underline animation */
      .link-underline {
        position: relative;
        display: inline-block;
      }
      .link-underline::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: -3px;
        width: 0;
        height: 1.5px;
        background: var(--accent);
        transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .link-underline:hover::after { width: 100%; }
      
      /* Corner notch brackets */
      .notch-corner {
        position: relative;
      }
      .notch-corner::before,
      .notch-corner::after {
        content: '';
        position: absolute;
        width: 12px;
        height: 12px;
        border: 1px solid var(--accent);
        pointer-events: none;
        transition: all 0.3s ease;
      }
      .notch-corner::before {
        top: -1px;
        left: -1px;
        border-right: none;
        border-bottom: none;
      }
      .notch-corner::after {
        bottom: -1px;
        right: -1px;
        border-left: none;
        border-top: none;
      }
      .notch-corner:hover::before,
      .notch-corner:hover::after {
        width: 20px;
        height: 20px;
        border-color: var(--accent-bright);
      }
      
      /* Section marker */
      .section-marker {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        color: var(--accent);
        text-transform: uppercase;
      }
      .section-marker::before {
        content: '';
        width: 28px;
        height: 1.5px;
        background: var(--accent);
      }
      
      /* 3D Flip Card */
      .flip-card {
        perspective: 1600px;
        height: 480px;
      }
      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
        transform-style: preserve-3d;
      }
      .flip-card:hover .flip-card-inner,
      .flip-card.flipped .flip-card-inner {
        transform: rotateY(180deg);
      }
      .flip-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        overflow: hidden;
      }
      .flip-back { transform: rotateY(180deg); }
      
      /* Interactive Goal / Filter Pills */
      .goal-pill {
        cursor: pointer;
        padding: 0.55rem 1.1rem;
        border: 1px solid var(--border-light);
        background: var(--bg-card);
        color: var(--fg-dim);
        font-family: 'Oswald', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: all 0.25s ease;
      }
      .goal-pill:hover {
        border-color: var(--silver-dim);
        color: var(--fg);
        background: var(--bg-card-hover);
      }
      .goal-pill.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #000;
        font-weight: 600;
      }
      
      /* Nav Link */
      .nav-link {
        position: relative;
        font-family: 'Oswald', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--fg-dim);
        transition: color 0.3s;
      }
      .nav-link:hover { color: var(--fg); }
      .nav-link::before {
        content: '';
        position: absolute;
        left: -12px;
        top: 50%;
        transform: translateY(-50%) scaleY(0);
        width: 3px;
        height: 8px;
        background: var(--accent);
        transition: transform 0.25s ease;
      }
      .nav-link:hover::before { transform: translateY(-50%) scaleY(1); }
      
      /* Sound & Telemetry Wave */
      @keyframes wave {
        0%, 100% { height: 3px; }
        50% { height: 16px; }
      }
      .wave-bar {
        display: inline-block;
        width: 2px;
        background: var(--accent);
        margin: 0 1.5px;
        height: 3px;
        vertical-align: bottom;
      }
      .active-telemetry .wave-bar { animation: wave 0.7s ease-in-out infinite; }
      .wave-bar:nth-child(2) { animation-delay: 0.1s; }
      .wave-bar:nth-child(3) { animation-delay: 0.2s; }
      .wave-bar:nth-child(4) { animation-delay: 0.3s; }
      .wave-bar:nth-child(5) { animation-delay: 0.4s; }
      
      /* Rec indicator blink */
      @keyframes rec-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      .rec-dot { animation: rec-blink 1.5s ease-in-out infinite; }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-track { background: var(--bg-darker); }
      ::-webkit-scrollbar-thumb { background: #262626; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
      
      /* Number display */
      .number-display { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body class="bg-textured text-zinc-100 selection:bg-[var(--accent)] selection:text-black">
    <div id="root"></div>
    <div class="grain" id="grain"></div>
    <div class="scan-line"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
